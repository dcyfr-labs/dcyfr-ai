name: Claude Code Security Review

# Thin caller — all review logic and the action/checkout SHA pins live in the
# single-source reusable workflow (dcyfr-labs/.github). Change the action
# version, model, or shared config THERE, not here; only this repo's
# exclude-directories differs. security-assessment 2026-08-15 (M5 durable fix).

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Skip bot PRs (dependabot, release-please): mechanical bumps do not need
    # an LLM review pass; CodeQL/Semgrep/npm-audit still cover them.
    if: ${{ !endsWith(github.actor, '[bot]') }}
    permissions:
      contents: read
      pull-requests: write
    # Pin must stay reachable from main in dcyfr-labs/.github: branch SHAs go
    # dangling when the branch is deleted after a squash-merge, and Actions
    # then fails the whole run at compile time ("workflow file issue", 0 jobs).
    uses: dcyfr-labs/.github/.github/workflows/security-review-reusable.yml@925197c9b0cce5cafc4d777265611098879812c7
    with:
      exclude-directories: 'node_modules, coverage, dist, docs, bin, config, examples, scripts'
    # The reusable workflow declares exactly one (optional) secret; pass it
    # explicitly instead of inheriting everything.
    secrets:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
