name: Claude Code Security Review

# Thin caller — all review logic and the action/checkout SHA pins live in the
# single-source reusable workflow (dcyfr-labs/.github). Change the action
# version, model, or shared config THERE, not here; only this repo's
# exclude-directories differs. security-assessment 2026-08-15 (M5 durable fix).

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: dcyfr-labs/.github/.github/workflows/security-review-reusable.yml@e9003e1f11bd488cdce12b484c1f8c6ba0a828e3
    with:
      exclude-directories: 'node_modules, coverage, dist, docs, bin, config, examples, scripts'
    secrets: inherit
